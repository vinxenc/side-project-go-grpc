# golangci-lint configuration for the auth-service module.
# Lives next to go.mod so per-module tooling (local runs and CodeRabbit's
# per-module scoping) discovers and configures the linter here.
version: "2"

run:
  timeout: 5m

linters:
  # The "standard" set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    rules:
      # Ignoring the error from an HTTP response Body.Close is idiomatic — the
      # body has already been read and there is nothing actionable to do on a
      # close failure. Scoped to test files, keeping the strict standard set
      # everywhere else.
      - path: _test\.go
        linters:
          - errcheck
        source: 'Body\.Close\(\)'
