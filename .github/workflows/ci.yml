name: CI

# Runs on every pull request targeting master. Individual service pipelines are
# gated behind path filters so a PR only pays for the pipelines it touches.
on:
  pull_request:
    branches: [master]

# Cancel superseded runs for the same PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which service folders changed so downstream pipelines can opt in.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
              - 'go.work'
              - 'go.work.sum'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  # auth-pipeline: lint, unit tests, and a Trivy scan. Runs only when the
  # auth-service folder (or its shared tooling) changed.
  auth-lint:
    name: auth-pipeline / lint
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.0
          working-directory: auth-service

  auth-unittest:
    name: auth-pipeline / unit tests
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

  # Black-box end-to-end tests: bring the full stack up with docker-compose
  # (Postgres + the auth-service container built from auth-service/Dockerfile),
  # then drive the real HTTP API over the published port. The suite is guarded
  # by the "e2e" build tag so it is excluded from the DB-free unit run above.
  auth-e2e:
    name: auth-pipeline / e2e
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: Start stack (postgres + auth-service)
        # Postgres applies migrations/ on init; the auth-service container waits
        # for it via depends_on: service_healthy. The e2e suite then polls
        # /health before running, so no extra readiness gate is needed here.
        run: docker compose --profile e2e up -d --build
      - name: Run e2e tests
        working-directory: auth-service
        env:
          BASE_URL: http://localhost:8080
        run: go test -tags=e2e -v ./tests/...
      - name: auth-service logs
        # Surface container logs for debugging whether the suite passed or not.
        if: always()
        run: docker compose --profile e2e logs auth-service
      - name: Tear down stack
        if: always()
        run: docker compose --profile e2e down -v

  auth-trivy:
    name: auth-pipeline / trivy scan
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: auth-service
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
